<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie 360</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #scene-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #fade-overlay { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
    #crosshair {
      position: fixed; top: 50%; left: 50%;
      width: 8px; height: 8px; margin: -4px 0 0 -4px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.6);
      pointer-events: none; transition: transform 0.15s, background 0.15s;
    }
    #crosshair.active { transform: scale(2.5); background: #ffd27a; }
  </style>
</head>
<body>
  <canvas id="scene-canvas"></canvas>
  <div id="fade-overlay"></div>
  <div id="crosshair"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
