<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galerie 360°</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      #scene-canvas { width: 100vw; height: 100vh; display: block; }
      
      /* Loader temporaire en attendant le travail du Membre C */
      #loader {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: #111;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        z-index: 999;
        transition: opacity 0.5s ease;
      }
      #loader.hidden { display: none; }
      .bar-bg { width: 200px; height: 6px; background: #333; margin-top: 10px; border-radius: 3px; }
      #loader-bar { width: 0%; height: 100%; background: #00ff88; transition: width 0.1s; }
    </style>
  </head>
  <body>
    <div id="loader">
      <p>Chargement du panorama 360°...</p>
      <div class="bar-bg"><div id="loader-bar"></div></div>
    </div>

    <canvas id="scene-canvas"></canvas>
    <script type="module" src="/src/main.js"></script>

    <div id="fade-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; opacity: 0; pointer-events: none; transition: opacity 0.6s; z-index: 99;"></div>
  </body>
</html>
